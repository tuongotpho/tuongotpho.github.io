name: Auto Deploy 4 Web Apps (GitHub Pages & Firebase Hosting Multi-site)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync_to_tuongotcay:
    name: Sync to tuongotcay.github.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to tuongotcay/tuongotcay.github.io
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -n "$PAT_TOKEN" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git remote add target https://x-access-token:${PAT_TOKEN}@github.com/tuongotcay/tuongotcay.github.io.git || true
            git push -f target main:main
            echo "✅ Successfully synced to tuongotcay/tuongotcay.github.io!"
          else
            echo "ℹ️ PAT_TOKEN secret not set yet. Skipping cross-repo sync."
          fi

  deploy_firebase:
    name: Deploy Multi-site to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting (tuongot-sieucay & tuongotsieucay)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUONGOT_SIECAY }}'
          channelId: live
          projectId: tuongot-sieucay
        continue-on-error: true
