name: Auto Deploy (Firebase Hosting + chuyen huong GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Chi giu MOT dia chi la tuongotsieucay.web.app. Hai ban GitHub Pages
  # (tuongotpho.github.io, tuongotcay.github.io) chi con trang chuyen huong ve do,
  # de link cu tren Facebook/Zalo van dung ma Google khong thay ban sao.
  pages_redirect:
    name: GitHub Pages tuongotpho.github.io (chuyen huong ve web.app)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Tao trang chuyen huong
        run: node .github/scripts/make-redirect-site.mjs "$RUNNER_TEMP/redirect"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/redirect

      - uses: actions/deploy-pages@v4

  sync_to_tuongotcay:
    name: Sync to tuongotcay.github.io (chuyen huong ve web.app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Push trang chuyen huong to tuongotcay/tuongotcay.github.io
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "ℹ️ PAT_TOKEN secret not set yet. Skipping cross-repo sync."
            exit 0
          fi
          OUT="$RUNNER_TEMP/redirect"
          node .github/scripts/make-redirect-site.mjs "$OUT"
          cd "$OUT"
          git init -q -b main
          git config user.name "tuongotpho"
          git config user.email "vietthanh228@gmail.com"
          git add -A
          git commit -q -m "chuyen huong ve tuongotsieucay.web.app"
          git push -f "https://${PAT_TOKEN}@github.com/tuongotcay/tuongotcay.github.io.git" main
          echo "✅ tuongotcay.github.io gio chi chuyen huong ve tuongotsieucay.web.app"

  deploy_order_api:
    name: Deploy API Dat Hang (Cloud Functions + Firestore Rules)
    runs-on: ubuntu-latest
    # Khong duoc chan viec deploy website neu API loi: web van chay duoc
    # nho kenh du phong, con hon la ca 4 site khong duoc cap nhat.
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Cai dat thu vien cho Functions
        working-directory: functions
        run: npm ci

      - name: Deploy Functions & Firestore Rules
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUONGOT_SIECAY }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::Chua co secret FIREBASE_SERVICE_ACCOUNT_TUONGOT_SIECAY. Bo qua deploy API."
            exit 0
          fi
          echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy \
            --only functions,firestore:rules \
            --project tuongot-sieucay \
            --non-interactive --force

  deploy_firebase:
    name: Deploy Multi-site to Firebase Hosting
    runs-on: ubuntu-latest
    # Deploy API truoc roi moi bat rewrite /api/order tren hosting.
    needs: deploy_order_api
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting (tuongot-sieucay & tuongotsieucay)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUONGOT_SIECAY }}'
          channelId: live
          projectId: tuongot-sieucay
        continue-on-error: true
